name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint & type-check
        run: |
          ruff check src tests
          black --check src tests
          mypy src
      - name: Tests (coverage gate ≥80% via addopts)
        run: pytest -m "not integration"

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel + sdist
        run: |
          pip install build
          python -m build
      - name: Wheel sanity (py.typed present, entry point imports)
        run: |
          unzip -l dist/*.whl | grep py.typed
          pip install dist/*.whl
          python -c "import rsge_mcp; print(rsge_mcp.__version__)"
          rsge-mcp --help 2>/dev/null || true  # stdio server has no --help; just ensure the script resolves
          command -v rsge-mcp
