[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rsge-mcp"
version = "0.1.0"
description = "MCP server for the rs.ge (Georgian Revenue Service) API"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Dimitri Gulua" }]
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "black>=24.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
rsge-mcp = "rsge_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rsge_mcp"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_return_any = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: unit tests (mocked HTTP)",
    "integration: live integration tests (gated by RSGE_RUN_INTEGRATION=1)",
]
addopts = "--cov=rsge_mcp --cov-report=term-missing --cov-fail-under=80"
